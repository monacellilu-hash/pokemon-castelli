<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pokémon Castelli Romani</title>

  <!-- F14: font pixel-art GBA (usato per titoli e nomi dialogo) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Mappa: occupa tutto lo schermo -->
  <div id="mappa"></div>

  <!-- HUD in alto a sinistra -->
  <div id="hud">
    <div id="hud-titolo">Pokémon Castelli Romani</div>
    <div>Passi: <span id="hud-passi">0</span></div>
    <!-- F9.1: riga orologio -->
    <div id="hud-tempo">Giorno 1 · 08:00 🌅</div>
    <!-- F9.2: portafoglio -->
    <div id="hud-soldi">₽ 3.000</div>
    <div id="hud-zona">📍 Castelli Romani</div>
    <div id="hud-squadra" style="display:none;"></div>
    <div id="hud-palestra" style="display:none;"></div>
  </div>

  <!-- Pannello menu di gioco: due modalità.
       "pausa" (tasto Invio/Start): Squadra, Zaino, Recap, Salva.
       "strumenti" (aperto interagendo nel mondo: PC del Centro → Box, NPC del Market → Market). -->
  <div id="pannello-menu" class="nascosto" role="dialog" aria-modal="true">
    <div id="menu-card">
      <div id="menu-testata">
        <div id="menu-tabs">
          <button class="tab attiva" data-modalita="pausa" data-sezione="squadra">⚡ Squadra</button>
          <button class="tab" data-modalita="pausa" data-sezione="zaino">🎒 Zaino</button>
          <button class="tab" data-modalita="pausa" data-sezione="recap">🎫 Recap</button>
          <button class="tab" data-modalita="pausa" data-sezione="salva">💾 Salva</button>
          <button class="tab" data-modalita="strumenti" data-sezione="market">🛒 Market</button>
          <button class="tab" data-modalita="strumenti" data-sezione="box">📦 Box</button>
        </div>
        <button id="btn-chiudi-menu" aria-label="Chiudi il menu">✖</button>
      </div>
      <div id="menu-contenuto"></div>
    </div>
  </div>

  <!-- Pulsanti rapidi overworld (Velocità/Repellente/Volo): impilati in un
       unico contenitore flex ancorato in basso a destra (mobile, sessione 31
       agosto) invece di 3 "bottom" fissi indipendenti — su schermi molto
       bassi (telefono in orizzontale) i "bottom" indipendenti potevano
       spingere Repellente/Volo fuori dallo schermo, in alto, inaccessibili. -->
  <div id="controlli-rapidi">
    <!-- Booster di velocità (cicla x1 → x2 → x3 → x5) -->
    <button id="btn-velocita" aria-label="Velocità di movimento">⏩ x1</button>

    <!-- MN Volo: appare solo quando si possiede la MN Volo (F9) -->
    <button id="btn-volo" aria-label="Vola verso una città" style="display:none;">✈️ Volo</button>

    <!-- Repellente rapido: appare solo se ne hai nello zaino (QoL) -->
    <button id="btn-repellente" aria-label="Usa repellente" style="display:none;">🚷 Repellente</button>
  </div>

  <!-- Riquadro dialoghi (Professore, Capipalestra, NPC) -->
  <div id="overlay-dialogo" class="nascosto" role="dialog" aria-modal="true">
    <div id="dialogo-card">
      <div id="dialogo-nome"></div>
      <div id="dialogo-testo"></div>
      <button id="dialogo-avanti">Avanti ▶</button>
    </div>
  </div>

  <!-- Scelta del personaggio (ragazzo/ragazza) a inizio partita -->
  <div id="overlay-genere" class="nascosto" role="dialog" aria-modal="true">
    <div id="starter-card">
      <h2>Chi sei tu?</h2>
      <div id="genere-scelte">
        <button class="card-starter card-genere boy" data-genere="boy">
          <div class="ritratto-genere"></div>
          <b>Ragazzo</b>
        </button>
        <button class="card-starter card-genere girl" data-genere="girl">
          <div class="ritratto-genere"></div>
          <b>Ragazza</b>
        </button>
      </div>
    </div>
  </div>

  <!-- Scelta dello starter dal Professore -->
  <div id="overlay-starter" class="nascosto" role="dialog" aria-modal="true">
    <div id="starter-card">
      <h2 id="starter-titolo">Scegli il tuo primo Pokémon!</h2>
      <div id="starter-scelte"></div>
    </div>
  </div>

  <!-- Croce direzionale (mobile + desktop) -->
  <div id="dpad">
    <button id="btn-su"       class="dpad-btn" aria-label="Su">▲</button>
    <button id="btn-sinistra" class="dpad-btn" aria-label="Sinistra">◀</button>
    <button id="btn-giu"      class="dpad-btn" aria-label="Giù">▼</button>
    <button id="btn-destra"   class="dpad-btn" aria-label="Destra">▶</button>
  </div>

  <!-- Schermata di battaglia -->
  <div id="schermata-battaglia" class="nascosto" role="dialog" aria-modal="true">
    <div id="battaglia-campo">
      <!-- PROBLEMA 2 (richiesta esplicita di Luca): niente bande nere ai lati
           su schermi larghi, ma niente sfondo stirato/deformato nemmeno. Questo
           layer riempie TUTTO #battaglia-campo con lo stesso battleback in
           "cover" (ritagliato, non stirato: le proporzioni restano quelle
           originali) e sfocato/scurito, come sfondo atmosferico ai lati.
           #battaglia-schermo sopra resta nitido e a rapporto 4:3 esatto, MAI
           deformato: l'elemento "vero" della scena. Vedi impostaSfondoBattaglia(). -->
      <div id="battaglia-sfondo-esteso"></div>
      <!-- Schermo a rapporto fisso 512x384 (risoluzione nativa Essentials FRLG):
           qui dentro tutto è scalato in proporzione, per non "stirare" sfondi e
           sprite su viewport larghi/16:9 come succedeva prima (bug segnalato:
           battleback troppo grandi/deformati). Vedi impostaSfondoBattaglia(). -->
      <div id="battaglia-schermo">
        <div id="battaglia-meteo" class="nascosto"></div>
        <div id="info-nemico" class="pannello-info">
          <div class="riga-nome">
            <span id="nemico-nome">—</span>
            <span id="nemico-lv"></span>
          </div>
          <div class="hp-contorno">
            <span class="hp-etichetta">HP</span>
            <div class="hp-binario"><div id="nemico-hp" class="hp-barra"></div></div>
          </div>
          <div id="nemico-contatore" style="display:none;"></div>
        </div>
        <div id="zona-nemico" class="sprite-zona">
          <img id="nemico-sprite" src="" alt="Pokémon avversario">
          <div class="piattaforma"></div>
        </div>
        <!-- Slot 2 (lotta in doppio, js/map.js _trainerSpottaDoppia + Battle.avviaDoppia):
             stessi elementi dello slot 1, id con suffisso "-2". Nascosti di
             default (style.css), mostrati solo con #schermata-battaglia.doppia. -->
        <div id="zona-nemico-2" class="sprite-zona nascosto">
          <img id="nemico-sprite-2" src="" alt="Secondo Pokémon avversario">
          <div class="piattaforma"></div>
        </div>
        <div id="zona-giocatore" class="sprite-zona">
          <img id="giocatore-sprite" src="" alt="Il tuo Pokémon">
          <div class="piattaforma"></div>
        </div>
        <div id="zona-giocatore-2" class="sprite-zona nascosto">
          <img id="giocatore-sprite-2" src="" alt="Il tuo secondo Pokémon">
          <div class="piattaforma"></div>
        </div>
        <div id="info-nemico-2" class="pannello-info nascosto">
          <div class="riga-nome">
            <span id="nemico-nome-2">—</span>
            <span id="nemico-lv-2"></span>
          </div>
          <div class="hp-contorno">
            <span class="hp-etichetta">HP</span>
            <div class="hp-binario"><div id="nemico-hp-2" class="hp-barra"></div></div>
          </div>
        </div>
        <div id="info-giocatore" class="pannello-info">
          <div class="riga-nome">
            <span id="giocatore-nome">—</span>
            <span id="giocatore-lv"></span>
          </div>
          <div class="hp-contorno">
            <span class="hp-etichetta">HP</span>
            <div class="hp-binario"><div id="giocatore-hp" class="hp-barra"></div></div>
          </div>
          <div id="giocatore-hp-testo"></div>
          <div class="exp-binario"><div id="giocatore-exp" class="exp-barra"></div></div>
        </div>
        <div id="info-giocatore-2" class="pannello-info nascosto">
          <div class="riga-nome">
            <span id="giocatore-nome-2">—</span>
            <span id="giocatore-lv-2"></span>
          </div>
          <div class="hp-contorno">
            <span class="hp-etichetta">HP</span>
            <div class="hp-binario"><div id="giocatore-hp-2" class="hp-barra"></div></div>
          </div>
          <div id="giocatore-hp-testo-2"></div>
        </div>
      </div>
    </div>
    <div id="battaglia-console">
      <div id="battaglia-messaggio">…</div>
      <div id="menu-principale" class="menu-battaglia nascosto">
        <button id="btn-attacca">⚔️ Attacca</button>
        <button id="btn-pokemon">🔄 Pokémon</button>
        <button id="btn-zaino">🎒 Zaino</button>
        <button id="btn-fuga">🏃 Fuga</button>
      </div>
      <div id="menu-mosse"   class="menu-battaglia nascosto"></div>
      <div id="menu-zaino"   class="menu-battaglia nascosto"></div>
      <div id="menu-squadra" class="menu-battaglia nascosto"></div>
      <!-- Selettore bersaglio (solo lotta in doppio): quando una mossa a
           bersaglio singolo viene scelta con 2 nemici vivi in campo. -->
      <div id="selettore-bersaglio" class="menu-battaglia nascosto"></div>
    </div>
  </div>

  <!-- Toast: notifiche brevi -->
  <div id="toast" class="nascosto"></div>

  <!-- Popup nome mappa: appare in alto a sinistra al cambio mappa -->
  <div id="popup-nome-mappa" class="nascosto"></div>

  <!-- Overlay interno edificio: appare quando si entra dalla porta -->
  <div id="overlay-interno" class="nascosto">
    <div id="interno-header">
      <span id="interno-titolo">Interno</span>
      <button id="btn-esci-interno">← Esci</button>
    </div>
    <div id="interno-scroll">
      <img id="interno-img" src="" alt="Interno edificio">
    </div>
  </div>

  <!-- Pulsante Interagisci: sempre visibile (sess. 5 set 2026, richiesta
       esplicita di Luca — prima compariva/scompariva come un popup con
       tanto di etichetta col nome di chi hai vicino, "non serve"). Resta
       comunque l'unico modo per interagire da telefono/touch (niente tasto
       [A] fisico lì): un pulsante fisso e discreto, senza notifica, che fa
       qualcosa solo quando c'è davvero qualcosa vicino (vedi btnInteragisci
       in js/map.js — il click controlla eventoVicino, a vuoto non fa nulla). -->
  <button id="btn-interagisci">[A]</button>

  <!-- Phaser 3 (motore grafico F14 — sostituisce Leaflet) -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>

  <!-- Dati mappe Tiled (NPC, trainer, porte, incontri, cartelli) -->
  <script src="dati/npc.js"></script>
  <script src="dati/trainer.js"></script>
  <script src="dati/porte.js"></script>
  <script src="dati/incontri.js"></script>
  <script src="dati/cartelli.js"></script>
  <script src="dati/cutscene.js"></script>

  <!-- Database mosse ed evoluzioni Gen 1-3 (prima di battle.js e app.js) -->
  <script src="dati/mosse.js"></script>
  <!-- Animazioni mosse: motore preciso da Pokémon Essentials FRLG (sostituisce mosse-animazioni.js) -->
  <script src="dati/animazioni_mosse_essentials.js"></script>
  <script src="js/animazioni-essentials.js"></script>
  <!-- Offset per-specie in battaglia (Essentials FRLG species_metrics.dat) -->
  <script src="dati/offset_sprite_battaglia.js"></script>
  <script src="dati/evoluzioni.js"></script>
  <!-- MT per tutte le mosse (generato, vedi strumenti/genera_mt_tutte_mosse.py) — PRIMA di js/data.js -->
  <script src="dati/mt_tutte_mosse.js"></script>
  <!-- Compatibilità Pokémon <-> MT (generato da Essentials FRLG/PBS/pokemon.txt) -->
  <script src="dati/mt_compatibilita.js"></script>

  <!-- Script del gioco (ordine: dati → zone → api → mappa → battaglia → avvio) -->
  <script src="js/data.js"></script>
  <script src="js/world.js"></script>
  <script src="js/pokeapi.js"></script>
  <script src="js/clusters.js"></script>
  <script src="js/map.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
